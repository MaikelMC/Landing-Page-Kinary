<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="description" content="Crea facturas gratis desde tu móvil. Tus facturas se quedan en tu dispositivo." />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MBM Invoice" />
  <title>MBM Invoice</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="adBar" class="ad-bar"><iframe data-aa="2460723" src="https://acceptable.a-ads.com/2460723/?size=Adaptive" title="Publicidad" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="topEyebrow">Facturas</div>
        <h1 id="pageTitle">Inicio</h1>
      </div>
      <button id="headerAction" class="icon-btn hidden" aria-label="Volver"></button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.7l8.5 6.9v9.1a.8.8 0 0 1-.8.8h-5.2v-6.2h-5v6.2H4.3a.8.8 0 0 1-.8-.8z"/></svg>
        <span>Inicio</span>
      </button>
      <button class="tab" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2a7.8 7.8 0 1 1-7.4 5.4H2.4l3.1-3.1 3.1 3.1H6.7A5.8 5.8 0 1 0 12 6.2v2.1L9.6 6 12 3.7zM11 8.5h2v4l3 1.8-1 1.7-4-2.4z"/></svg>
        <span>Historial</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2A3.8 3.8 0 1 1 12 15.8 3.8 3.8 0 0 1 12 8.2Zm8.1 3.8-.1-1.1 2-1.5-2-3.4-2.4 1a8.7 8.7 0 0 0-1.9-1.1L15.4 3h-4l-.4 2.9c-.7.3-1.3.6-1.9 1.1L6.7 6 4.7 9.4l2 1.5-.1 1.1.1 1.1-2 1.5 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.4 2.9h4l.4-2.9c.7-.3 1.3-.6 1.9-1.1l2.4 1 2-3.4-2-1.5z"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <section id="modal" class="modal" role="dialog" aria-modal="true"></section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <input id="importFile" type="file" class="hidden" aria-label="Elegir copia de seguridad" />

  <noscript>MBM Invoice necesita JavaScript para funcionar.</noscript>
  <script src="app.js"></script>
</body>
</html>
